name: Verify Linux settings
on:
  push:
    branches: [verify/linux-settings]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_PROFILE_DEV_DEBUG: 0
      VERSION_NUMBER: 0.0.0
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - uses: dtolnay/rust-toolchain@21dc36fb71dd22e3317045c0c31a3f4249868b17
        with:
          toolchain: nightly
      - uses: swatinem/rust-cache@f0deed1e0edfc6a9be95417288c0e1099b1eeec3
      - name: Install desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xvfb openbox xdotool x11-utils imagemagick desktop-file-utils
      - run: pnpm install --frozen-lockfile
      - run: pnpm run --filter zebar --filter @zebar/settings-ui build
      - run: pnpm --filter @zebar/desktop tauri build --debug --bundles deb
      - name: Verify settings in a virtual desktop
        run: xvfb-run -a dbus-run-session -- bash .github/scripts/verify-linux-settings.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-settings-evidence
          path: linux-settings-evidence
